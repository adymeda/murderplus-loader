<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murder Plus Loading Screen</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <link rel="icon" type="image/x-icon" href="mplus-rounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Birthstone&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
</head>
<body>
    <img id="back-img" src="imgs/background-default.png" draggable="false">
    <audio id="music" loop>
        <source src="sounds/scars.ogg" type="audio/ogg">
    </audio>
    <div id="logo">
        <img src="mplus-rounded.png" alt="Logo" id="logo-img" draggable="false">
        <div id="server-name">Murder Plus</div>
    </div>
    <div id="tip">Совет:</div>
    <div id="progress-status"></div>
    <div id="progress-bar">
        <div id="progress"></div>
    </div>
</body>
</html
